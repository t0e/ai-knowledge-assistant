name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DEBUG: "True"
      SECRET_KEY: test_ci_secret_key_minimum_32_characters_long_for_security
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/knowledge_test_db
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/knowledge_test_db
      REDIS_URL: redis://localhost:6379/0
      EMBEDDING_PROVIDER: mock
      LLM_PROVIDER: mock
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Ruff Lint Check
        run: |
          ruff check apps/api

      - name: Run Ruff Formatting Check
        run: |
          ruff format --check apps/api

      - name: Run Alembic Database Migrations
        run: |
          cd apps/api
          alembic upgrade head
          cd ../..

      - name: Run Pytest Test Suite
        run: |
          pytest apps/api/tests -v --tb=short

  frontend-ci:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "apps/web/package.json"

      - name: Install Node dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Next.js Production Build
        run: |
          export NEXT_PUBLIC_API_URL=http://localhost:8000
          npm run build
